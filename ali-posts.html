<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ali's Posts</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      background: linear-gradient(135deg, #f8fafc, #e2e8f0);
      padding: 24px;
    }

    .container {
      max-width: 720px;
      margin: 0 auto;
    }

    h1 {
      font-size: 1.875rem;
      font-weight: 700;
      color: #1e293b;
      text-align: center;
      margin-bottom: 8px;
    }

    .description {
      color: #64748b;
      text-align: center;
      margin-bottom: 32px;
    }

    .back-link {
      display: inline-block;
      margin-bottom: 24px;
      color: #4f46e5;
      text-decoration: none;
      font-weight: 500;
    }

    .back-link:hover { text-decoration: underline; }

    #loading {
      text-align: center;
      color: #64748b;
      padding: 40px 0;
    }

    .post {
      background: #ffffff;
      border-radius: 12px;
      box-shadow: 0 2px 12px rgba(0, 0, 0, 0.06);
      padding: 24px;
      margin-bottom: 16px;
    }

    .post h2 {
      font-size: 1.125rem;
      color: #1e293b;
      margin-bottom: 8px;
      text-transform: capitalize;
    }

    .post p {
      color: #475569;
      line-height: 1.6;
    }

    .error {
      text-align: center;
      color: #dc2626;
      padding: 40px 0;
    }
  </style>
</head>
<body>
  <div class="container">
    <a href="index.html" class="back-link">&larr; Back to home</a>
    <h1>Ali's Posts</h1>
    <p class="description">
      This page fetches data from the
      <strong>JSONPlaceholder API</strong> (<code>jsonplaceholder.typicode.com/posts</code>).
      The API returns a list of sample blog posts, each with a title and body.
      Below are the first 10 posts displayed.
    </p>
    <div id="posts">
      <p id="loading">Loading posts...</p>
    </div>
  </div>

  <script>
    fetch("https://jsonplaceholder.typicode.com/posts?_limit=10")
      .then(function (response) {
        return response.json();
      })
      .then(function (posts) {
        var container = document.getElementById("posts");
        container.innerHTML = "";
        posts.forEach(function (post) {
          var div = document.createElement("div");
          div.className = "post";
          div.innerHTML =
            "<h2>" + post.title + "</h2>" +
            "<p>" + post.body + "</p>";
          container.appendChild(div);
        });
      })
      .catch(function () {
        var container = document.getElementById("posts");
        container.innerHTML = '<p class="error">Failed to load posts. Please try again later.</p>';
      });
  </script>
</body>
</html>
