name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  docker-build:
    name: Docker Build Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Copy .env from example
        run: cp .env.example .env

      - name: Build backend image
        run: docker build ./backend -t backend:ci
