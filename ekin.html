<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ekin's API Page</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #f8fafc, #e2e8f0);
            padding: 24px;
            margin: 0;
        }
        .card {
            width: 100%;
            max-width: 640px;
            background: #fff;
            border-radius: 16px;
            box-shadow: 0 4px 24px rgba(0,0,0,0.08);
            padding: 48px 40px;
        }
        h1 { font-size: 1.5rem; color: #1e293b; margin-bottom: 8px; }
        .description { color: #64748b; margin-bottom: 24px; }
        .loading { color: #94a3b8; }
        .data { background: #f1f5f9; border-radius: 12px; padding: 20px; margin-top: 16px; }
        .data h2 { font-size: 1.1rem; color: #334155; margin-bottom: 8px; }
        .data p { color: #475569; line-height: 1.6; margin: 4px 0; }
        a { color: #4f46e5; text-decoration: none; }
        a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="card">
        <h1>Random User API</h1>
        <p class="description">
            This page calls the <a href="https://randomuser.me/" target="_blank">Random User API</a>,
            which generates random fake user data (name, email, location, etc.).
            It is commonly used for testing and prototyping.
        </p>
        <div id="result"><p class="loading">Loading...</p></div>
    </div>
    <script>
        fetch("https://randomuser.me/api/")
            .then(function(response) { return response.json(); })
            .then(function(data) {
                var user = data.results[0];
                document.getElementById("result").innerHTML =
                    '<div class="data">' +
                    '<h2>' + user.name.first + ' ' + user.name.last + '</h2>' +
                    '<p><strong>Email:</strong> ' + user.email + '</p>' +
                    '<p><strong>Location:</strong> ' + user.location.city + ', ' + user.location.country + '</p>' +
                    '<p><strong>Phone:</strong> ' + user.phone + '</p>' +
                    '</div>';
            })
            .catch(function(err) {
                document.getElementById("result").innerHTML =
                    '<p style="color:#ef4444;">Error: ' + err.message + '</p>';
            });
    </script>
</body>
